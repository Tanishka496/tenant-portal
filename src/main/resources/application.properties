spring.application.name=tenant-portal-backend

spring.datasource.url=jdbc:h2:file:./data/tenantportal;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

app.cors.allowed-origin=http://localhost:5500
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:change-me-now}
